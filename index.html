<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USN – สหพันธรัฐอธิปไตยโลก</title>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1b3a;--sky:#8fd6ff;--blue:#2e9bff;--white:#fff;--sun:#ffc12e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;font-family:'Kanit','Noto Sans Thai','Sarabun',sans-serif;color:var(--navy);overflow:hidden;background:linear-gradient(#5cc0ff,#bfe8ff 70%,#e9f8ff)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.screen.on{display:flex}
.cloud{position:fixed;background:#fff;border-radius:50px;opacity:.9;border:3px solid var(--navy);z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border:3px solid var(--navy);border-radius:50%}
.cloud::before{width:46%;height:150%;left:14%;top:-70%;border-bottom-color:transparent}
.cloud::after{width:34%;height:120%;left:52%;top:-45%;border-bottom-color:transparent}
.logo{position:relative;width:min(260px,62vw);border-radius:22px;border:4px solid var(--navy);box-shadow:6px 6px 0 var(--navy);transform:rotate(-2deg)}
h1{position:relative;font-weight:600;font-size:clamp(28px,7vw,46px);margin:20px 0 0;color:#fff;-webkit-text-stroke:2px var(--navy);paint-order:stroke fill;text-shadow:4px 4px 0 var(--navy);text-align:center}
.sub{position:relative;margin:8px 0 22px;font-weight:600;text-align:center}
nav{position:relative;display:grid;gap:12px;width:min(420px,100%)}
.btn,nav button{font:inherit;font-weight:600;font-size:18px;color:var(--navy);background:#fff;border:3px solid var(--navy);border-radius:16px;padding:12px 18px;box-shadow:4px 4px 0 var(--navy);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:transform .1s,box-shadow .1s}
nav button:hover,.btn:hover{transform:translate(-1px,-2px);box-shadow:5px 6px 0 var(--navy)}
nav button:active,.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--navy)}
nav button:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
nav button.main{background:var(--blue);color:#fff}
nav button small{font-weight:400}
#map{padding:0;justify-content:flex-start;align-items:stretch;background:#5cc0ff}
#sv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px;pointer-events:none}
.top>*{pointer-events:auto}
.top h2{margin:0;font-size:18px;background:#fff;border:3px solid var(--navy);border-radius:14px;padding:5px 14px;box-shadow:3px 3px 0 var(--navy)}
.zoom{position:absolute;z-index:2;right:14px;top:80px;display:grid;gap:8px}
.zoom .btn{width:46px;height:46px;padding:0;justify-content:center;font-size:24px}
.hint{position:absolute;z-index:2;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border:3px solid var(--navy);border-radius:12px;padding:4px 12px;font-size:13px;box-shadow:3px 3px 0 var(--navy)}
#card{position:absolute;z-index:3;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:#fff;border:4px solid var(--navy);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.3,1.4,.5,1);max-width:560px;margin:0 auto}
#card.on{transform:none}
#card h3{margin:0 0 4px;font-size:22px}
#card .org{font-size:13px;margin-bottom:10px}
#card ol{list-style:none;margin:0;padding:0}
#card li{display:flex;gap:10px;padding:8px 0;border-top:2px dashed #b9d9f0;font-size:16px}
#card li span.l{min-width:120px;font-weight:600;flex:none}
#card .x{position:absolute;right:14px;top:12px;width:40px;height:40px;padding:0;justify-content:center;font-size:20px}
.page{position:relative;max-width:460px;text-align:center}
.page p{font-size:18px}
#phx{cursor:pointer}
#phx path.land{transition:filter .15s}
#phx:hover path.land{filter:brightness(1.1)}
@media(prefers-reduced-motion:reduce){#card{transition:none}}

body,.btn,nav button,h1,h2,h3,#cam text{font-family:'Itim','Kanit','Noto Sans Thai',sans-serif}
body{background:radial-gradient(circle at 20% 15%,#fff 0 6%,transparent 7%),linear-gradient(#4db8ff,#a8e2ff 65%,#e9f8ff)}
h1{font-size:clamp(32px,8vw,54px);-webkit-text-stroke:3px var(--navy);text-shadow:5px 5px 0 var(--navy);animation:pop 2.6s ease-in-out infinite}
.sub{font-size:18px}
.logo{border-width:5px;border-radius:28px;box-shadow:8px 8px 0 var(--navy);animation:flo 3.6s ease-in-out infinite}
nav button,.btn{border-width:4px;border-radius:24px;font-size:20px;box-shadow:5px 6px 0 var(--navy)}
nav button{animation:in .5s backwards cubic-bezier(.3,1.6,.5,1)}
nav button:nth-child(2){animation-delay:.08s}nav button:nth-child(3){animation-delay:.16s}nav button:nth-child(4){animation-delay:.24s}nav button:nth-child(5){animation-delay:.32s}
nav button:hover,.btn:hover{animation:wig .4s}
.cloud{animation:drift 9s ease-in-out infinite alternate}
.cloud:nth-of-type(2){animation-duration:12s}.cloud:nth-of-type(3){animation-duration:7s}
.sp{position:fixed;z-index:0;font-style:normal;color:#fff;text-shadow:2px 2px 0 var(--navy);animation:tw 2.4s ease-in-out infinite}
.top h2{border-width:4px;border-radius:20px;font-size:20px;box-shadow:4px 5px 0 var(--navy)}
.hint{border-width:4px;border-radius:16px;box-shadow:4px 5px 0 var(--navy)}
#card{border-width:5px;border-radius:34px 34px 0 0}
#card::before{content:"";display:block;width:56px;height:7px;border-radius:5px;background:var(--navy);margin:-6px auto 10px}
#card h3{font-size:26px}
#card li{border-top:3px dotted #8fd0f5;font-size:18px;animation:in .4s backwards}
#cam image{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 5px 0 rgba(11,27,58,.3))}
#fun text{pointer-events:none}
.bob{font-size:54px;animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{50%{transform:scale(1.04) rotate(-.6deg)}}
@keyframes flo{50%{transform:rotate(2deg) translateY(-8px)}}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.9)}}
@keyframes wig{25%{transform:rotate(-1.5deg) translate(-1px,-2px)}75%{transform:rotate(1.5deg) translate(-1px,-2px)}}
@keyframes drift{to{transform:translateX(40px)}}
@keyframes tw{50%{transform:scale(1.5) rotate(20deg);opacity:.6}}
@keyframes bob{50%{transform:translateY(-12px) rotate(5deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#map.shot .top,#map.shot .zoom,#map.shot .hint,#map.shot #card{display:none!important}#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:#fff;border:4px solid var(--navy);border-radius:16px;padding:6px 14px;box-shadow:4px 5px 0 var(--navy);opacity:0;transition:opacity .3s;pointer-events:none;font-family:'Itim','Kanit',sans-serif;white-space:nowrap}#toast.on{opacity:1}input.ed,textarea.ed{font:inherit;flex:1;min-width:0;border:3px solid var(--navy);border-radius:12px;padding:4px 8px;background:#fff;color:var(--navy);font-size:16px}textarea.ed{min-height:64px;resize:vertical}</style>
</head>

function viewSize(){const r=svg.getBoundingClientRect(),s=Math.max(r.width/1600,r.height/800);return [r.width/s,r.height/s];}
let cur=null;function gtxt(){$('#geo').textContent=cur.geo?'🏳️ กลับเป็นแผนที่ประเทศ':'🌍 ปรับเป็นแผนที่ภูมิศาสตร์';}
let ST={};try{ST=JSON.parse(localStorage.getItem('usn-edits-v1')||'{}')}catch(e){}
function saveST(){try{localStorage.setItem('usn-edits-v1',JSON.stringify(ST))}catch(e){}}
function rowsOf(c){return c.f||FL.map((l,i)=>[l,c.d[i]]);}
function setLabel(c,t){const el=document.getElementById(c.img);const tx=el&&el.parentNode.querySelector('text');if(tx)tx.textContent=t;}
function renderCard(c,edit){const ol=$('#cl');ol.textContent='';$('#cn').textContent=c.d[0];
 rowsOf(c).forEach((r,i)=>{const li=document.createElement('li'),sp=document.createElement('span');sp.className='l';sp.textContent=r[0];li.appendChild(sp);
  if(edit){const t=document.createElement(String(r[1]).length>40?'textarea':'input');t.className='ed';t.value=r[1];li.appendChild(t);}else li.appendChild(document.createTextNode(r[1]));ol.appendChild(li);});
 const eb=$('#eb');eb.textContent='';const mk=(tx,fn)=>{const b=document.createElement('button');b.className='btn';b.style.cssText='flex:1;justify-content:center;font-size:17px';b.textContent=tx;b.onclick=fn;eb.appendChild(b);};
 if(!edit)mk('✏️ แก้ไขข้อมูล',()=>renderCard(c,true));else{mk('💾 บันทึก',()=>saveEdit(c));mk('✖ ยกเลิก',()=>renderCard(c,false));mk('↺ คืนค่าเดิม',()=>resetEdit(c));}
 $('#geo').style.display=edit?'none':'';}
function saveEdit(c){const v=[...$('#cl').querySelectorAll('.ed')].map(t=>t.value);const rows=rowsOf(c).map((r,i)=>[r[0],v[i]]);const o=JSON.parse(c.orig);c.f=rows;c.d=[rows[0][1]];ST[c.img]=v;saveST();if(rows[0][1]!==o[0][1])setLabel(c,rows[0][1]);renderCard(c,false);}
function resetEdit(c){delete ST[c.img];saveST();c.f=JSON.parse(c.orig);c.d=[c.f[0][1]];setLabel(c,c.labelOrig);renderCard(c,false);}
function exportEdits(b){const o={};COUNTRIES.forEach(c=>{if(JSON.stringify(rowsOf(c))!==c.orig)o[c.d[0]]=rowsOf(c);});const t=JSON.stringify(o,null,1);const done=()=>{b.textContent='✅ คัดลอกแล้ว';setTimeout(()=>b.textContent='📋 คัดลอกข้อมูลที่แก้ไข',2200)};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>prompt('คัดลอกข้อความนี้',t));else prompt('คัดลอกข้อความนี้',t);}
function openC(c){cur=c;gtxt();const [vw,vh]=viewSize(),k=Math.min(vw*.9/c.w,vh*.34/c.h,6);flyCam({k,x:800-c.cx*k,y:400-vh/2+vh*.19-c.cy*k});
 $('#cn').textContent=c.d[0];
 renderCard(c,false);
 $('#card').scrollTop=0;$('#card').classList.add('on');}
function fitTarget(all){const [vw,vh]=viewSize();let k=Math.min(vw/6450,vh/2650,1.2);return {k,x:800-3165*k,y:400-1255*k};}
function fitNow(){cam=fitTarget();apply();}

/* flat map camera: pan, zoom, pinch, fly-to */
const svg=$('#sv'),G=$('#cam');let cam={x:0,y:0,k:1},ptrs=new Map(),moved=0,pd=0,anim=0;
const apply=()=>G.setAttribute('transform','translate('+cam.x+' '+cam.y+') scale('+cam.k+')');
const sp=(cx,cy)=>{const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse());};
function zoomAt(p,f){const nk=Math.max(.2,Math.min(14,cam.k*f));f=nk/cam.k;cam.x=p.x-(p.x-cam.x)*f;cam.y=p.y-(p.y-cam.y)*f;cam.k=nk;apply();}
function flyCam(b){cancelAnimationFrame(anim);const a={...cam},t0=performance.now();
 const red=matchMedia('(prefers-reduced-motion:reduce)').matches;
 (function s(t){let u=red?1:Math.min(1,(t-t0)/800);u=1-Math.pow(1-u,3);cam={x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,k:a.k+(b.k-a.k)*u};apply();if(u<1)anim=requestAnimationFrame(s);})(t0);}
svg.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);moved=0;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);}});
svg.addEventListener('pointermove',e=>{const o=ptrs.get(e.pointerId);if(!o)return;const n={x:e.clientX,y:e.clientY};
 if(ptrs.size===1){const sc=svg.getScreenCTM().a;moved+=Math.abs(n.x-o.x)+Math.abs(n.y-o.y);cam.x+=(n.x-o.x)/sc;cam.y+=(n.y-o.y)/sc;apply();}
 else if(ptrs.size===2){ptrs.set(e.pointerId,n);const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);moved=99;if(pd)zoomAt(sp((a.x+b.x)/2,(a.y+b.y)/2),d/pd);pd=d;}
 ptrs.set(e.pointerId,n);});
function mkMask(src,cb){const I=new Image();I.onload=()=>{const w=160,h=Math.max(1,Math.round(I.height*w/I.width)),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(I,0,0,w,h);const d=x.getImageData(0,0,w,h).data,a=new Uint8Array(w*h);for(let i=0;i<a.length;i++)a[i]=d[i*4+3];cb({w,h,a});};I.src=src;}
function prep(c){mkMask(document.getElementById(c.img).getAttribute('href'),m=>{c.mk=m;});}
COUNTRIES.forEach(prep);
function hit(e){const p=sp(e.clientX,e.clientY),wx=(p.x-cam.x)/cam.k,wy=(p.y-cam.y)/cam.k;
 for(const c of [...COUNTRIES].reverse()){const mk=c.geo?c.gmk:c.mk;if(!mk)continue;const m=document.getElementById(c.img),u=(wx-+m.getAttribute('x'))/+m.getAttribute('width'),v=(wy-+m.getAttribute('y'))/+m.getAttribute('height');
  if(u<0||u>1||v<0||v>1)continue;if(mk.a[Math.min(mk.h-1,Math.floor(v*mk.h))*mk.w+Math.min(mk.w-1,Math.floor(u*mk.w))]>40)return c;}return null;}
const end=e=>{const was=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);pd=0;if(was&&moved<8&&ptrs.size===0){if($('#map').classList.contains('shot')){$('#map').classList.remove('shot');return;}const c=hit(e);if(c)openC(c);}};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(sp(e.clientX,e.clientY),Math.exp(-e.deltaY*.0015));},{passive:false});
